apiVersion: apps/v1
kind: Deployment
metadata:
  name: piotr-skwarna-cv
spec:
  selector:
    matchLabels:
      app: cv
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 3
  template:
    metadata:
      labels:
        app: cv
    spec:
      containers:
        - name: cv
          image: spideropl/cv:latest
          imagePullPolicy: Always
          ports:
            - name: cv
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: piotr-skwarna-cv-service
spec:
  selector:
    app: cv
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
