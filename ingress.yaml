apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: piotr-skwarna-cv-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: mojecv-domenka.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: piotr-skwarna-cv-service
                port:
                  number: 8080
